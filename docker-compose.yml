services:
  app:
    build: .
    image: json-contract-studio:latest
    container_name: json-contract-studio
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/health"]
      interval: 15s
      timeout: 3s
      retries: 5
